<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hand Controlled Earth</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="permissions-policy" content="camera=(self)">
<meta name="description" content="Control Earth using hand gestures or touch">

<style>
body {
  margin: 0;
  overflow: hidden;
  background: radial-gradient(circle at top, #061a40, #000);
  font-family: system-ui, -apple-system, sans-serif;
}

#ui {
  position: absolute;
  top: 10px;
  width: 100%;
  text-align: center;
  color: white;
  font-size: 13px;
  z-index: 10;
}

#status {
  position: absolute;
  top: 32px;
  width: 100%;
  text-align: center;
  font-size: 11px;
  color: lime;
  z-index: 10;
}

video, canvas#skeleton {
  position: absolute;
  bottom: 10px;
  right: 10px;
  width: 140px;
  border-radius: 10px;
  opacity: 0.85;
  z-index: 10;
}

canvas#skeleton {
  pointer-events: none;
}
</style>
</head>

<body>

<div id="ui">🤏 Pinch + Move → Rotate | ✊ Fist → Zoom In | 🖐 Open → Zoom Out</div>
<div id="status">Initializing…</div>

<video id="video" autoplay playsinline muted></video>
<canvas id="skeleton"></canvas>

<script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<script>
/* ================= THREE ================= */

const scene = new THREE.Scene();
const camera3D = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 1000);
camera3D.position.z = 4.2;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 0.4));
const sun = new THREE.DirectionalLight(0xffffff, 1.2);
sun.position.set(5, 3, 5);
scene.add(sun);

const loader = new THREE.TextureLoader();
const earth = new THREE.Mesh(
  new THREE.SphereGeometry(1.45, 96, 96),
  new THREE.MeshPhongMaterial({
    map: loader.load("https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg"),
    emissiveMap: loader.load("https://threejs.org/examples/textures/planets/earth_lights_2048.png"),
    emissiveIntensity: 0.7,
    shininess: 20
  })
);
scene.add(earth);

/* ================= STATE ================= */

let targetZoom = camera3D.position.z;
let rotX = 0, rotY = 0;
let usingTouch = false;

/* ================= HAND TRACKING ================= */

const video = document.getElementById("video");
const statusText = document.getElementById("status");
const skelCanvas = document.getElementById("skeleton");
const skelCtx = skelCanvas.getContext("2d");

let hand = null;
let lastX = null, lastY = null;

function drawSkeleton(landmarks) {
  skelCanvas.width = video.videoWidth;
  skelCanvas.height = video.videoHeight;
  skelCtx.clearRect(0,0,skelCanvas.width,skelCanvas.height);

  skelCtx.strokeStyle = "lime";
  skelCtx.lineWidth = 2;

  const connections = [
    [0,1],[1,2],[2,3],[3,4],
    [0,5],[5,6],[6,7],[7,8],
    [5,9],[9,10],[10,11],[11,12],
    [9,13],[13,14],[14,15],[15,16],
    [13,17],[17,18],[18,19],[19,20]
  ];

  connections.forEach(([a,b]) => {
    skelCtx.beginPath();
    skelCtx.moveTo(landmarks[a].x * skelCanvas.width, landmarks[a].y * skelCanvas.height);
    skelCtx.lineTo(landmarks[b].x * skelCanvas.width, landmarks[b].y * skelCanvas.height);
    skelCtx.stroke();
  });
}

const hands = new Hands({
  locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`
});

hands.setOptions({
  maxNumHands: 1,
  modelComplexity: 0,
  minDetectionConfidence: 0.6,
  minTrackingConfidence: 0.6
});

hands.onResults(res => {
  if (res.multiHandLandmarks && res.multiHandLandmarks.length) {
    hand = res.multiHandLandmarks[0];
    usingTouch = false;
    statusText.innerText = "Hand tracking active ✅";
    drawSkeleton(hand);
  } else {
    hand = null;
    skelCtx.clearRect(0,0,skelCanvas.width,skelCanvas.height);
  }
});

try {
  new Camera(video, {
    onFrame: async () => hands.send({ image: video }),
    facingMode: "user",
    width: 640,
    height: 480
  }).start();
} catch {
  usingTouch = true;
}

/* ================= TOUCH FALLBACK ================= */

let lastDist = null;

renderer.domElement.addEventListener("touchstart", e => {
  usingTouch = true;
  statusText.innerText = "Touch mode active 📱";
});

renderer.domElement.addEventListener("touchmove", e => {
  e.preventDefault();
  if (e.touches.length === 1) {
    rotY += e.touches[0].movementX * 0.002;
    rotX += e.touches[0].movementY * 0.002;
  }
  if (e.touches.length === 2) {
    const d = Math.hypot(
      e.touches[0].pageX - e.touches[1].pageX,
      e.touches[0].pageY - e.touches[1].pageY
    );
    if (lastDist) targetZoom += (lastDist - d) * 0.002;
    lastDist = d;
  }
},{ passive:false });

renderer.domElement.addEventListener("touchend", () => lastDist = null);

/* ================= GESTURES ================= */

function dist(a,b){ return Math.hypot(a.x-b.x,a.y-b.y); }

function animate(){
  requestAnimationFrame(animate);

  if (hand) {
    const wrist = hand[0];
    const pinch = dist(hand[4], hand[8]);
    const openness =
      dist(hand[0],hand[8]) +
      dist(hand[0],hand[12]) +
      dist(hand[0],hand[16]) +
      dist(hand[0],hand[20]);

    if (pinch < 0.08) {
      if (lastX !== null) {
        rotY += (wrist.x-lastX)*6;
        rotX += (wrist.y-lastY)*6;
      }
      lastX=wrist.x; lastY=wrist.y;
    } else lastX=lastY=null;

    if (openness < 1.4) targetZoom -= 0.05;
    if (openness > 2.0) targetZoom += 0.05;
  }

  targetZoom = THREE.MathUtils.clamp(targetZoom,2.6,7);
  camera3D.position.z += (targetZoom-camera3D.position.z)*0.12;
  earth.rotation.x += (rotX-earth.rotation.x)*0.1;
  earth.rotation.y += (rotY-earth.rotation.y)*0.1;

  renderer.render(scene,camera3D);
}

animate();

window.addEventListener("resize",()=>{
  camera3D.aspect=innerWidth/innerHeight;
  camera3D.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>

</body>
</html>
