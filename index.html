<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hand Controlled Earth</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="description" content="Control Earth using your hand on mobile and desktop">
<meta name="permissions-policy" content="camera=(self)">

<style>
body {
  margin: 0;
  overflow: hidden;
  background: radial-gradient(circle at top, #061a40, #000);
  font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
}

#ui {
  position: absolute;
  top: 10px;
  width: 100%;
  text-align: center;
  color: white;
  font-size: 13px;
  opacity: 0.9;
  z-index: 10;
  padding: 0 10px;
}

video {
  position: absolute;
  bottom: 10px;
  right: 10px;
  width: 120px;
  border-radius: 10px;
  opacity: 0.8;
  border: 2px solid rgba(255,255,255,0.3);
  z-index: 10;
}

#mobileNote {
  position: absolute;
  bottom: 60px;
  width: 100%;
  text-align: center;
  font-size: 11px;
  color: #ccc;
  opacity: 0.7;
  z-index: 10;
}
</style>
</head>

<body>

<div id="ui">🤏 Pinch + Move → Rotate | ✊ Fist → Zoom In | 🖐 Open → Zoom Out</div>
<div id="mobileNote">Works best in good lighting • Keep hand centered</div>
<video id="video" autoplay playsinline muted></video>

<script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<script>
/* ===== DEVICE DETECTION ===== */

const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

/* ===== THREE.JS ===== */

const scene = new THREE.Scene();

const camera3D = new THREE.PerspectiveCamera(
  45,
  innerWidth / innerHeight,
  0.1,
  1000
);
camera3D.position.z = 4.2;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 0.4));
const sun = new THREE.DirectionalLight(0xffffff, 1.2);
sun.position.set(5, 3, 5);
scene.add(sun);

/* ===== EARTH ===== */

const loader = new THREE.TextureLoader();
const earth = new THREE.Mesh(
  new THREE.SphereGeometry(1.45, isMobile ? 96 : 128, isMobile ? 96 : 128),
  new THREE.MeshPhongMaterial({
    map: loader.load("https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg"),
    emissiveMap: loader.load("https://threejs.org/examples/textures/planets/earth_lights_2048.png"),
    emissiveIntensity: 0.7,
    shininess: 20
  })
);
scene.add(earth);

/* ===== MEDIAPIPE ===== */

const video = document.getElementById("video");

const hands = new Hands({
  locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`
});

hands.setOptions({
  maxNumHands: 1,
  modelComplexity: isMobile ? 0 : 1,
  minDetectionConfidence: 0.7,
  minTrackingConfidence: 0.7
});

let hand = null;
let targetZoom = camera3D.position.z;

hands.onResults(res => {
  hand = null;
  if (res.multiHandLandmarks && res.multiHandedness[0]?.label === "Right") {
    hand = res.multiHandLandmarks[0];
  }
});

/* Rear camera preferred on mobile */
const cam = new Camera(video, {
  onFrame: async () => hands.send({ image: video }),
  facingMode: isMobile ? "environment" : "user",
  width: 640,
  height: 480
});
cam.start();

/* ===== GESTURES ===== */

function dist(a, b) {
  return Math.hypot(a.x - b.x, a.y - b.y);
}

let lastX = null, lastY = null;
let rotX = 0, rotY = 0;

function animate() {
  requestAnimationFrame(animate);

  if (hand) {
    const wrist = hand[0];
    const pinch = dist(hand[4], hand[8]);

    const openness =
      dist(hand[0], hand[8]) +
      dist(hand[0], hand[12]) +
      dist(hand[0], hand[16]) +
      dist(hand[0], hand[20]);

    /* Rotate */
    if (pinch < (isMobile ? 0.07 : 0.06)) {
      if (lastX !== null) {
        rotY += (wrist.x - lastX) * 5;
        rotX += (wrist.y - lastY) * 5;
      }
      lastX = wrist.x;
      lastY = wrist.y;
    } else {
      lastX = lastY = null;
    }

    /* Zoom */
    if (openness < (isMobile ? 1.3 : 1.2)) {
      targetZoom -= 0.04;
    } else if (openness > (isMobile ? 1.9 : 1.8)) {
      targetZoom += 0.04;
    }

    targetZoom = THREE.MathUtils.clamp(targetZoom, 2.6, 7);
  }

  camera3D.position.z += (targetZoom - camera3D.position.z) * 0.1;
  earth.rotation.x += (rotX - earth.rotation.x) * 0.08;
  earth.rotation.y += (rotY - earth.rotation.y) * 0.08;

  renderer.render(scene, camera3D);
}

animate();

window.addEventListener("resize", () => {
  camera3D.aspect = innerWidth / innerHeight;
  camera3D.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>

</body>
</html>
