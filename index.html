<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hand Controlled Earth – Country Detail</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  overflow: hidden;
  background: black;
  font-family: Arial, sans-serif;
}
#ui {
  position: absolute;
  top: 15px;
  width: 100%;
  text-align: center;
  color: white;
  font-size: 14px;
  z-index: 10;
}
video {
  position: absolute;
  bottom: 15px;
  right: 15px;
  width: 160px;
  border-radius: 10px;
  opacity: 0.8;
  z-index: 10;
}
</style>
</head>

<body>

<div id="ui">✋ Right Hand → Rotate | 🤏 Left Hand → Zoom</div>
<video id="video" autoplay playsinline></video>

<script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<script>
/* ================= THREE SETUP ================= */

const scene = new THREE.Scene();

const camera3D = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 1000);
camera3D.position.z = 4;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(devicePixelRatio);
document.body.appendChild(renderer.domElement);

/* ================= LIGHT ================= */

scene.add(new THREE.AmbientLight(0xffffff, 0.35));
const sun = new THREE.DirectionalLight(0xffffff, 1.4);
sun.position.set(5, 3, 5);
scene.add(sun);

/* ================= EARTH TEXTURES ================= */

const loader = new THREE.TextureLoader();

const earthMat = new THREE.MeshPhongMaterial({
  map: loader.load("https://cdn.jsdelivr.net/gh/ajdruff/earthTextures@main/8k_earth_daymap.jpg"),
  bumpMap: loader.load("https://cdn.jsdelivr.net/gh/ajdruff/earthTextures@main/8k_earth_bump.jpg"),
  bumpScale: 0.05,
  specularMap: loader.load("https://cdn.jsdelivr.net/gh/ajdruff/earthTextures@main/8k_earth_specular.jpg"),
  specular: new THREE.Color("grey"),
  shininess: 15
});

const earth = new THREE.Mesh(
  new THREE.SphereGeometry(1.5, 256, 256),
  earthMat
);
scene.add(earth);

/* ================= COUNTRY BORDERS ================= */

fetch("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json")
.then(res => res.json())
.then(data => {
  const borders = topojson.mesh(data, data.objects.countries);
  const geo = new THREE.BufferGeometry();
  const verts = [];

  borders.coordinates.forEach(line => {
    line.forEach(([lon, lat]) => {
      const phi = (90 - lat) * Math.PI / 180;
      const theta = (lon + 180) * Math.PI / 180;

      const r = 1.501;
      verts.push(
        r * Math.sin(phi) * Math.cos(theta),
        r * Math.cos(phi),
        r * Math.sin(phi) * Math.sin(theta)
      );
    });
  });

  geo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
  const borderLines = new THREE.LineSegments(
    geo,
    new THREE.LineBasicMaterial({ color: 0xffffff, opacity: 0.6, transparent: true })
  );

  scene.add(borderLines);
});

/* ================= MEDIAPIPE ================= */

const video = document.getElementById("video");
const hands = new Hands({
  locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`
});

hands.setOptions({
  maxNumHands: 2,
  minDetectionConfidence: 0.75,
  minTrackingConfidence: 0.75
});

let leftHand, rightHand;
let targetZoom = 4;

hands.onResults(res => {
  leftHand = rightHand = null;
  if (!res.multiHandLandmarks) return;
  res.multiHandedness.forEach((h, i) => {
    if (h.label === "Left") leftHand = res.multiHandLandmarks[i];
    if (h.label === "Right") rightHand = res.multiHandLandmarks[i];
  });
});

new Camera(video, {
  onFrame: async () => hands.send({ image: video }),
  width: 640,
  height: 480
}).start();

/* ================= CONTROLS ================= */

function dist(a, b) {
  return Math.hypot(a.x - b.x, a.y - b.y);
}

let rx = 0, ry = 0;

function animate() {
  requestAnimationFrame(animate);

  if (rightHand) {
    ry += (rightHand[0].x - 0.5) * 0.03;
    rx += (rightHand[0].y - 0.5) * 0.03;
  }

  if (leftHand) {
    const pinch = dist(leftHand[4], leftHand[8]);
    targetZoom = THREE.MathUtils.clamp(6 - pinch * 10, 2.5, 7);
  }

  camera3D.position.z += (targetZoom - camera3D.position.z) * 0.08;
  earth.rotation.x += (rx - earth.rotation.x) * 0.05;
  earth.rotation.y += (ry - earth.rotation.y) * 0.05;

  renderer.render(scene, camera3D);
}

animate();

window.addEventListener("resize", () => {
  camera3D.aspect = innerWidth/innerHeight;
  camera3D.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>

<!-- topojson REQUIRED -->
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>

</body>
</html>
